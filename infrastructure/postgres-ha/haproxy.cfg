global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 5m
    timeout server 5m
    timeout check 3s

listen postgres
    bind 0.0.0.0:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
    server postgres-1 172.28.40.11:5432 check port 8008
    server postgres-2 172.28.40.12:5432 check port 8008
