scope: flowrun-postgres
namespace: /service/

restapi:
    listen: 0.0.0.0:8008

etcd3:
    host: etcd:2379

bootstrap:
    dcs:
        ttl: 30
        loop_wait: 5
        retry_timeout: 10
        primary_start_timeout: 0
        primary_stop_timeout: 10
        synchronous_mode: true
        synchronous_mode_strict: false
        synchronous_node_count: 1
        maximum_lag_on_failover: 1048576
        postgresql:
            use_pg_rewind: true
            use_slots: true
            parameters:
                wal_level: replica
                hot_standby: "on"
                wal_log_hints: "on"
                wal_keep_size: 128MB
                max_slot_wal_keep_size: 1GB
                max_wal_senders: 10
                max_replication_slots: 10
                password_encryption: scram-sha-256
    initdb:
        - encoding: UTF8
        - data-checksums
    pg_hba:
        - local all all trust
        - host all all 127.0.0.1/32 trust
        - host replication replicator 172.28.40.0/24 scram-sha-256
        - host all all 172.28.40.0/24 scram-sha-256
    post_init: /opt/flowrun/post-init.sh

postgresql:
    listen: 0.0.0.0:5432
    data_dir: /var/lib/postgresql/data/pgdata
    bin_dir: /usr/lib/postgresql/16/bin
    pgpass: /tmp/patroni.pgpass
    parameters:
        unix_socket_directories: /tmp

watchdog:
    mode: "off"
