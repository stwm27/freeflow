global
    log stdout format raw local0
    maxconn 256
    stats socket /tmp/rabbitmq-haproxy.sock mode 600 level user

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 3s

listen amqp
    bind 0.0.0.0:5672
    balance first
    option tcp-check
    default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions
    server rabbitmq-1 172.28.30.103:5672 check
    server rabbitmq-2 172.28.30.104:5672 check
    server rabbitmq-3 172.28.30.105:5672 check

listen management
    bind 0.0.0.0:15672
    mode http
    balance first
    option httpchk GET /
    http-check expect status 200
    default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions
    server rabbitmq-1 172.28.30.103:15672 check
    server rabbitmq-2 172.28.30.104:15672 check
    server rabbitmq-3 172.28.30.105:15672 check
