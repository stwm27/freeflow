services:
    task-api:
        build: ./task-api
        container_name: flowrun-task-api
        ports:
        - 127.0.0.1:8000:8000
        restart: unless-stopped
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: flowrun
            POSTGRES_USER: flowrun
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            REDIS_URL: redis://redis:6379/0
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        image: flowrun-task-api
        networks:
            app:
                ipv4_address: 172.28.20.10
            data:
                ipv4_address: 172.28.30.10
    postgres:
        build: ./infrastructure/postgres-ha
        image: flowrun-postgres-ha
        entrypoint:
        - haproxy
        command:
        - -W
        - -db
        - -f
        - /etc/patroni/haproxy.cfg
        restart: unless-stopped
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        network_mode: service:postgres-firewall
        tmpfs:
        - /var/lib/postgresql/data
        depends_on:
            postgres-firewall:
                condition: service_healthy
            postgres-1:
                condition: service_healthy
            postgres-2:
                condition: service_healthy
        healthcheck:
            test:
            - CMD
            - python
            - /opt/flowrun/check-router.py
            interval: 5s
            timeout: 6s
            retries: 24
            start_period: 10s
    redis:
        image: redis:7-alpine
        healthcheck:
            test:
            - CMD
            - redis-cli
            - ping
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            data:
                ipv4_address: 172.28.30.101
    rabbitmq:
        image: rabbitmq:4-management
        hostname: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: flowrun
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
        ports:
        - 127.0.0.1:15672:15672
        volumes:
        - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test:
            - CMD
            - rabbitmq-diagnostics
            - -q
            - check_running
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        networks:
            data:
                ipv4_address: 172.28.30.102
            management: {}
    scheduler:
        build: ./scheduler
        restart: unless-stopped
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: flowrun
            POSTGRES_USER: flowrun
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_USER: flowrun
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            app:
                ipv4_address: 172.28.20.30
            data:
                ipv4_address: 172.28.30.30
    worker:
        build: ./worker
        restart: unless-stopped
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: flowrun
            POSTGRES_USER: flowrun
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_USER: flowrun
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            app:
                ipv4_address: 172.28.20.20
            data:
                ipv4_address: 172.28.30.20
    frontend:
        build: ./frontend
        restart: unless-stopped
        networks:
            edge:
                ipv4_address: 172.28.10.20
    gateway:
        image: nginx:stable-alpine
        restart: unless-stopped
        ports:
        - 127.0.0.1:8080:80
        volumes:
        - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            task-api:
                condition: service_started
            frontend:
                condition: service_started
        networks:
            edge:
                ipv4_address: 172.28.10.10
            app:
                ipv4_address: 172.28.20.2
    postgres-firewall:
        build: ./infrastructure/firewall
        restart: unless-stopped
        cap_add:
        - NET_ADMIN
        networks:
            data:
                ipv4_address: 172.28.30.100
                aliases:
                - postgres
            pg-ha:
                ipv4_address: 172.28.40.100
        healthcheck:
            test:
            - CMD
            - test
            - -f
            - /tmp/firewall-ready
            interval: 5s
            timeout: 3s
            retries: 10
    etcd:
        image: quay.io/coreos/etcd:v3.5.21
        restart: unless-stopped
        command:
        - --name=etcd
        - --data-dir=/etcd-data
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://etcd:2379
        - --listen-peer-urls=http://0.0.0.0:2380
        - --initial-advertise-peer-urls=http://etcd:2380
        - --initial-cluster=etcd=http://etcd:2380
        - --initial-cluster-state=new
        volumes:
        - etcd-data:/etcd-data
        networks:
            pg-ha:
                ipv4_address: 172.28.40.10
        healthcheck:
            test:
            - CMD
            - /usr/local/bin/etcdctl
            - --endpoints=http://127.0.0.1:2379
            - endpoint
            - health
            interval: 5s
            timeout: 3s
            retries: 20
        entrypoint:
        - /usr/local/bin/etcd
    postgres-1:
        build: ./infrastructure/postgres-ha
        image: flowrun-postgres-ha
        restart: unless-stopped
        stop_grace_period: 30s
        environment:
            PATRONI_NAME: postgres-1
            PATRONI_POSTGRESQL_CONNECT_ADDRESS: 172.28.40.11:5432
            PATRONI_RESTAPI_CONNECT_ADDRESS: 172.28.40.11:8008
            PATRONI_SUPERUSER_USERNAME: flowrun
            PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD
                in .env}
            PATRONI_REPLICATION_USERNAME: replicator
            PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?Set POSTGRES_REPLICATION_PASSWORD
                in .env}
            PATRONI_RESTAPI_USERNAME: flowrun-admin
            PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:?Set PATRONI_API_PASSWORD
                in .env}
        volumes:
        - postgres-1-data:/var/lib/postgresql/data
        networks:
            pg-ha:
                ipv4_address: 172.28.40.11
        depends_on:
            etcd:
                condition: service_healthy
        healthcheck:
            test:
            - CMD
            - curl
            - --fail
            - --silent
            - --show-error
            - --max-time
            - '3'
            - http://127.0.0.1:8008/health
            interval: 5s
            timeout: 4s
            retries: 48
            start_period: 10s
    postgres-2:
        build: ./infrastructure/postgres-ha
        image: flowrun-postgres-ha
        restart: unless-stopped
        stop_grace_period: 30s
        environment:
            PATRONI_NAME: postgres-2
            PATRONI_POSTGRESQL_CONNECT_ADDRESS: 172.28.40.12:5432
            PATRONI_RESTAPI_CONNECT_ADDRESS: 172.28.40.12:8008
            PATRONI_SUPERUSER_USERNAME: flowrun
            PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD
                in .env}
            PATRONI_REPLICATION_USERNAME: replicator
            PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?Set POSTGRES_REPLICATION_PASSWORD
                in .env}
            PATRONI_RESTAPI_USERNAME: flowrun-admin
            PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:?Set PATRONI_API_PASSWORD
                in .env}
        volumes:
        - postgres-2-data:/var/lib/postgresql/data
        networks:
            pg-ha:
                ipv4_address: 172.28.40.12
        depends_on:
            etcd:
                condition: service_healthy
        healthcheck:
            test:
            - CMD
            - curl
            - --fail
            - --silent
            - --show-error
            - --max-time
            - '3'
            - http://127.0.0.1:8008/health
            interval: 5s
            timeout: 4s
            retries: 48
            start_period: 10s
volumes:
    postgres-data: null
    rabbitmq-data: null
    postgres-1-data: null
    postgres-2-data: null
    etcd-data: null
networks:
    edge:
        name: flowrun-edge
        ipam:
            config:
            -   subnet: 172.28.10.0/24
    app:
        name: flowrun-app
        ipam:
            config:
            -   subnet: 172.28.20.0/24
    data:
        name: flowrun-data
        internal: true
        ipam:
            config:
            -   subnet: 172.28.30.0/24
    management:
        name: flowrun-management
    pg-ha:
        name: flowrun-pg-ha
        internal: true
        ipam:
            config:
            -   subnet: 172.28.40.0/24
