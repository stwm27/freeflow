services:
    task-api:
        build: ./task-api
        container_name: flowrun-task-api
        ports:
            - "8000:8000"
        restart: unless-stopped
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: flowrun
            POSTGRES_USER: flowrun
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            REDIS_URL: redis://redis:6379/0
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: flowrun
            POSTGRES_USER: flowrun
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "flowrun", "-d", "flowrun"]
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    rabbitmq:
        image: rabbitmq:4-management
        hostname: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: flowrun
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
        ports:
            - "127.0.0.1:15672:15672"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

volumes:
    postgres-data:
    rabbitmq-data: